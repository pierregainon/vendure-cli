  name: Java CI with Maven

  on:
    push:
      branches: [ "main" ]
    pull_request:
      branches: [ "main" ]

  jobs:
    build-and-test:
      runs-on: ubuntu-latest

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up JDK 21
          uses: actions/setup-java@v4
          with:
            java-version: '21'
            distribution: 'temurin'
            cache: maven

        # a) Lancement des tests unitaires
        - name: Run tests with Maven
          run: mvn test

        # b) Vérification du formatage Google Java Style
        - name: Check Java Format
          uses: axel-op/googlejavaformat-action@v3
          with:
            args: --check