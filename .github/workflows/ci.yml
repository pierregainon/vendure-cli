name: Java CI with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: maven

      # a) Lance tes tests unitaires (Déjà validé au vert précédemment)
      - name: Run tests with Maven
        run: mvn test

      # b) Vérification simple du formatage Google
      - name: Check Java Format
        uses: axel-op/googlejavaformat-action@v3